name: 🕰️ GPS Manual Backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start Date (YYYY-MM-DD)'
        required: true
        default: ''
      end_date:
        description: 'End Date (Optional, defaults to start_date) (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --upgrade -r requirements.txt

      - name: Run Manual Backfill
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${{ github.event.inputs.end_date }}" ]; then
            python gps_sync_engine.py --start_date ${{ github.event.inputs.start_date }} --end_date ${{ github.event.inputs.start_date }}
          else
            python gps_sync_engine.py --start_date ${{ github.event.inputs.start_date }} --end_date ${{ github.event.inputs.end_date }}
          fi
