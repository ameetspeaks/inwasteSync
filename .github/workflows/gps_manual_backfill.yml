name: 🕰️ GPS Manual Backfill

on:
  workflow_dispatch:
    inputs:
      backfill_date:
        description: 'Date to backfill (YYYY-MM-DD)'
        required: true
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --upgrade -r requirements.txt

      - name: Run Manual Backfill
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        run: python gps_sync_engine.py --backfill ${{ github.event.inputs.backfill_date }}
